name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
      - name: Compile Bicep
        run: |
          az bicep install
          for file in infra/*.bicep; do az bicep build --file "$file" --outfile /tmp/$(basename "$file").json; done
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Build container
        run: docker build -t portfolio:test .
